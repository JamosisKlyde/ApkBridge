name: Pocket Pi-hole Host - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - pocket-pihole-v0.1-prototype

permissions:
  contents: read

jobs:
  build:
    name: Build prototype APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype source
        uses: actions/checkout@v4
        with:
          ref: pocket-pihole-v0.1-prototype
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p PocketPiHost assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPiHost-v0.1-debug
          path: PocketPiHost/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
