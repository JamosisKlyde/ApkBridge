name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q app
          for script in install-or-update.sh uninstall.sh packaging/apkbridge packaging/run-header.sh; do
            bash -n "$script"
          done
      - name: Verify published installer checksum
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
